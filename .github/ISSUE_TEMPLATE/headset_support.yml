name: Headset support
description: Report whether a headset works through HeadsetControl, or ask for support
labels: [headset]
body:
  - type: input
    id: headset
    attributes:
      label: Headset
      description: Model and USB ID if you know it (HeadsetControl prints it, e.g. 1b1c:0a51)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it work through HeadsetControl?
      options:
        - "Yes, it switches on and off"
        - "Partly (explain below)"
        - "No"
        - "HeadsetControl doesn't support it"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: HeadsetControl output
      description: Output of `headsetcontrol -b -o json` with the headset on, and again with it off.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Notes
