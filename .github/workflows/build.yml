name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: HeadsetAutoSwitch
          path: HeadsetAutoSwitch.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" HeadsetAutoSwitch.exe --title "$GITHUB_REF_NAME" --generate-notes
